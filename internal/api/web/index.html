<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Heimdall</title>

    <link
            rel="stylesheet"
            href="/css/main.css"
    >

    <script
            type="module"
            src="/js/app.js"
            defer
    ></script>
</head>

<body>

<div class="login-overlay" id="login-overlay">
    <div class="login-panel">
        <div class="login-wordmark">
            <h1>HEIMDALL</h1>
        </div>
        <form class="add-form login-form" id="login-form">
            <input id="login-username" placeholder="username" required>
            <input type="password" id="login-password" placeholder="password" required>
            <button>LOG IN</button>
        </form>
        <div class="form-error" id="login-error"></div>
    </div>
</div>

<header>
    <div class="header-row">

        <div class="wordmark">
            <h1>HEIMDALL</h1>
            <span class="subtitle">
                watching truenas
            </span>
        </div>

        <div class="header-right">

            <div class="app-state">
                <span
                        class="status-dot info"
                        id="app-state-dot"
                ></span>
                <span id="app-state-text">running</span>
            </div>

            <div class="status">
                <span
                        class="status-dot info"
                        id="status-dot"
                ></span>

                <span id="status-text">
                    nominal
                </span>
            </div>

            <button id="logout-btn" class="logout-btn">LOGOUT</button>

        </div>

    </div>

    <nav>
        <button
                class="tab active"
                data-view="watch">
            WATCH
        </button>

        <button
                class="tab"
                data-view="sources">
            SOURCES
        </button>

        <button
                class="tab"
                data-view="rules">
            RULES
        </button>

        <button
                class="tab"
                data-view="reports">
            REPORTS
        </button>

        <button
                class="tab"
                data-view="activity">
            ACTIVITY
        </button>

        <button
                class="tab"
                data-view="ops">
            OPS
        </button>
    </nav>
</header>

<div
        class="bifrost"
        id="bifrost"
></div>

<main>

    <div
            class="view active"
            id="view-watch">

        <div class="toolbar">
            <div class="filters">

                <button
                        class="filter-btn active"
                        data-severity="all">
                    ALL
                </button>

                <button
                        class="filter-btn"
                        data-severity="warning">
                    WARNING
                </button>

                <button
                        class="filter-btn"
                        data-severity="critical">
                    CRITICAL
                </button>

            </div>
        </div>

        <div
                class="event-list"
                id="event-list">
        </div>

    </div>

    <div
            class="view"
            id="view-sources">

        <div
                class="source-list"
                id="source-list">
        </div>

        <form
                class="add-form"
                id="source-form">

            <select id="source-type"></select>

            <input
                    id="source-path"
                    placeholder="/var/log/example.log"
                    required
            >

            <button>
                ADD SOURCE
            </button>

        </form>

        <div
                class="form-error"
                id="source-error">
        </div>

    </div>

    <div
            class="view"
            id="view-rules">

        <div
                class="source-list"
                id="rule-list">
        </div>

        <form
                class="add-form"
                id="rule-form">

            <select id="rule-source-type"></select>

            <input
                    id="rule-pattern"
                    placeholder="regex pattern"
                    required
            >

            <select id="rule-severity">
                <option value="info">info</option>
                <option value="warning">warning</option>
                <option value="critical">critical</option>
            </select>

            <input
                    id="rule-event-type"
                    placeholder="event type"
                    required
            >

            <button>
                ADD RULE
            </button>

        </form>

        <div
                class="form-error"
                id="rule-error">
        </div>

    </div>

    <div
            class="view"
            id="view-reports">

        <div class="toolbar">

            <button
                    class="filter-btn"
                    id="generate-report-btn">
                GENERATE NOW
            </button>

        </div>

        <div
                id="report-list">
        </div>

        <div
                class="form-error"
                id="report-error">
        </div>

    </div>

    <div class="view" id="view-activity">

        <div class="toolbar">
            <div class="filters">
                <button class="filter-btn active" data-window="1h">1H</button>
                <button class="filter-btn" data-window="24h">24H</button>
                <button class="filter-btn" data-window="48h">48H</button>
            </div>
        </div>

        <div class="event-list" id="activity-list"></div>

    </div>

    <div class="view" id="view-ops">

        <div id="system-status" class="source-list"></div>

        <div id="container-buttons" class="source-list"></div>

        <form class="add-form" id="command-form">
            <input id="command-input" placeholder="restart, shutdown, restart ollama...">
            <button>RUN</button>
        </form>
        <div class="form-error" id="command-error"></div>

        <form class="add-form" id="password-form">
            <input type="password" id="current-password" placeholder="current password" required>
            <input type="password" id="new-password" placeholder="new password" required>
            <button>CHANGE PASSWORD</button>
        </form>
        <div class="form-error" id="password-error"></div>

    </div>

</main>

</body>
</html>
